<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resend runner</title>
<style>
  :root{--bg:#f6f7f4;--ink:#1d2320;--muted:#66706a;--line:#d9ddd6;--card:#fff;--accent:#1f5f4a;--bad:#b3341f;--ok:#1f5f4a;--warn:#9a6b00}
  @media (prefers-color-scheme:dark){:root{--bg:#141815;--ink:#e8ece9;--muted:#94a099;--line:#2c342f;--card:#1b211d;--accent:#5fb897;--bad:#ef7b66;--ok:#5fb897;--warn:#e0b44a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:32px 20px 64px}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
  p.sub{color:var(--muted);margin:0 0 24px}
  section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
  h2{font-size:15px;margin:0 0 14px}
  label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
  label small{font-weight:400;color:var(--muted)}
  input[type=text],input[type=password],input[type=number]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
  input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
  button{font:inherit;font-weight:600;padding:9px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  @media (prefers-color-scheme:dark){button{color:#0d1511}}
  button.ghost{background:transparent;color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  progress{width:100%;height:8px;margin:10px 0}
  #stats{color:var(--muted);font-size:13px}
  #log{max-height:320px;overflow:auto;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
  .ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
  .note{color:var(--muted);font-size:12.5px;margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>Resend runner</h1>
  <p class="sub">Give it a page, two XPaths and a CSV. It works through the list on the server.</p>

  <section>
    <h2>Target page</h2>
    <label for="url">Landing page URL</label>
    <input type="text" id="url" placeholder="https://applications.example.edu/apply">
    <div class="row">
      <div><label for="emailXpath">Email field XPath <small>(default works for most pages)</small></label><input type="text" id="emailXpath" value='//*[@id="Email"]'></div>
      <div><label for="submitXpath">Submit button XPath <small>(default works for most pages)</small></label><input type="text" id="submitXpath" value='//*[@id="registerBtn"]'></div>
    </div>
    <div class="row">
      <div><label for="followupXpath">Resend link XPath <small>(optional, clicked after submit)</small></label><input type="text" id="followupXpath" placeholder='//a[text()="Click here"]'></div>
      <div><label for="closeXpath">Close popup XPath <small>(optional)</small></label><input type="text" id="closeXpath" placeholder="//span[@aria-hidden='true']"></div>
    </div>
    <label for="errorText">Invalid-email message <small>(optional, text the page shows for a bad email)</small></label>
    <input type="text" id="errorText" placeholder="Seems your Email ID is incorrect">
  </section>

  <section>
    <h2>Emails and pacing</h2>
    <label for="csv">CSV file <small>(needs an "email" column, or emails in the first column)</small></label>
    <input type="file" id="csv" accept=".csv,text/csv">
    <div id="count" class="note"></div>
    <div class="row">
      <div><label for="minDelay">Min wait between emails (sec)</label><input type="number" id="minDelay" value="3" min="1"></div>
      <div><label for="maxDelay">Max wait (sec)</label><input type="number" id="maxDelay" value="8" min="1"></div>
    </div>
    <label for="backoff">Wait when the site says "too many requests" (sec)</label>
    <input type="number" id="backoff" value="120" min="10">
    <label for="password">Access password <small>(the APP_PASSWORD you set in Vercel)</small></label>
    <input type="password" id="password" autocomplete="off">
    <div class="actions">
      <button id="start">Start</button>
      <button id="stop" class="ghost" disabled>Stop</button>
      <button id="download" class="ghost" disabled>Download remaining emails</button>
    </div>
    <p class="note">Each address gets a real email from the target site. Run it only for people who signed up and expect it.</p>
  </section>

  <section>
    <h2>Progress</h2>
    <progress id="bar" value="0" max="1"></progress>
    <div id="stats">Not started</div>
    <div id="log" aria-live="polite"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fields = ["url","emailXpath","submitXpath","followupXpath","closeXpath","errorText","minDelay","maxDelay","backoff"];
let emails = [], done = new Set(), running = false, stopFlag = false;

fields.forEach((f) => { let v = null; try { v = localStorage.getItem("rr_" + f); } catch {} if (v) $(f).value = v; $(f).addEventListener("blur", () => { if (!$(f).value.trim()) $(f).value = $(f).defaultValue; }); $(f).addEventListener("input", () => { try { localStorage.setItem("rr_" + f, $(f).value); } catch {} }); });

function parseCsv(text) {
  const rows = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((l) => l.split(",").map((c) => c.trim().replace(/^"|"$/g, "")));
  if (!rows.length) return [];
  const header = rows[0].map((h) => h.toLowerCase());
  let idx = header.indexOf("email"), start = 1;
  if (idx === -1) { idx = 0; start = header[0].includes("@") ? 0 : 1; }
  return [...new Set(rows.slice(start).map((r) => r[idx]).filter((e) => e && e.includes("@")))];
}

$("csv").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  emails = parseCsv(await f.text()); done = new Set();
  $("count").textContent = `${emails.length} unique emails loaded`;
  $("bar").max = Math.max(emails.length, 1); $("bar").value = 0;
  $("download").disabled = emails.length === 0;
});

function log(msg, cls = "") { const d = document.createElement("div"); d.className = cls; d.textContent = msg; $("log").prepend(d); }
const val = (id) => $(id).value.trim() || $(id).defaultValue;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function stats() { $("bar").value = done.size; $("stats").textContent = `${done.size} of ${emails.length} handled`; }

async function call(email) {
  const body = { email };
  ["url","emailXpath","submitXpath","followupXpath","closeXpath","errorText"].forEach((k) => (body[k] = val(k)));
  const r = await fetch("/api/resend", { method: "POST", headers: { "Content-Type": "application/json", "x-app-password": $("password").value }, body: JSON.stringify(body) });
  if (r.status === 401) return { status: "auth" };
  try { return await r.json(); } catch { return { status: "error", message: "Server timed out or crashed" }; }
}

$("start").addEventListener("click", async () => {
  if (!emails.length) return log("Load a CSV first", "bad");
  if (!val("url") || !val("emailXpath") || !val("submitXpath")) return log("URL, email XPath and submit XPath are required", "bad");
  running = true; stopFlag = false; $("start").disabled = true; $("stop").disabled = false;
  for (const email of emails) {
    if (stopFlag) break;
    if (done.has(email)) continue;
    let res;
    while (true) {
      res = await call(email);
      if (res.status === "rate_limited" && !stopFlag) {
        const s = +$("backoff").value; log(`429 from site, waiting ${s}s`, "warn");
        for (let i = 0; i < s && !stopFlag; i++) await sleep(1000);
        if (stopFlag) break; continue;
      }
      break;
    }
    if (stopFlag) break;
    if (res.status === "auth") { log("Wrong password", "bad"); break; }
    if (res.status === "processed") { done.add(email); log(`Processed ${email}`, "ok"); }
    else if (res.status === "invalid") { done.add(email); log(`Invalid email ${email}`, "warn"); }
    else log(`Error ${email}: ${res.message || res.status}`, "bad");
    stats();
    const min = +$("minDelay").value, max = Math.max(+$("maxDelay").value, min);
    await sleep((min + Math.random() * (max - min)) * 1000);
  }
  running = false; $("start").disabled = false; $("stop").disabled = true;
  log(stopFlag ? "Stopped" : "Finished", "ok");
});

$("stop").addEventListener("click", () => { stopFlag = true; });

$("download").addEventListener("click", () => {
  const rest = emails.filter((e) => !done.has(e));
  const blob = new Blob(["email\n" + rest.join("\n") + "\n"], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "remaining.csv"; a.click();
});
</script>
</body>
</html>
